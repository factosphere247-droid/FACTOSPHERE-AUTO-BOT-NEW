name: FACTOSPHERE Auto Upload

on:
  schedule:
    # Bangladesh time (UTC+6):
    # 1:00 PM  -> Short
    # 5:00 PM  -> Long
    # 7:00 PM  -> Short
    # 11:00 PM -> Short
    - cron: "0 7 * * *"
    - cron: "0 11 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"

  workflow_dispatch:
    inputs:
      video_type:
        description: "What should the bot create?"
        required: true
        default: "short"
        type: choice
        options:
          - short
          - long

permissions:
  contents: write

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout FACTOSPHERE bot
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select video type
        id: type
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "video_type=${{ inputs.video_type }}" >> "$GITHUB_OUTPUT"
          else
            HOUR="$(date -u +%H)"
            case "$HOUR" in
              07) echo "video_type=short" >> "$GITHUB_OUTPUT" ;;
              11) echo "video_type=long" >> "$GITHUB_OUTPUT" ;;
              13) echo "video_type=short" >> "$GITHUB_OUTPUT" ;;
              17) echo "video_type=short" >> "$GITHUB_OUTPUT" ;;
              *) echo "video_type=short" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Run FACTOSPHERE Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python bot.py "${{ steps.type.outputs.video_type }}"

      - name: Save topic history
        if: success()
        shell: bash
        run: |
          if [ -f topic_history.json ] && [ -n "$(git status --porcelain topic_history.json)" ]; then
            git config user.name "FACTOSPHERE Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add topic_history.json
            git commit -m "Update FACTOSPHERE topic history"
            git push
          fi
